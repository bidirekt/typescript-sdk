name: Bug report
description: Report something that does not work as expected.
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The command you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: What the command printed.
      render: text
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: The versions in the output of `npm ls @bidirekt/typescript-sdk @bidirekt/typescript-sdk-cli`.
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: The output of `node --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: The operating system and its version.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      description: The annotated code involved, if any.
      render: typescript
