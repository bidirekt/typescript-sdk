version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      # @types/node follows the Node major CI runs on (24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript stays on 6.x: 7.0 has no compiler API, which the reader uses.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: ['minor', 'patch']
